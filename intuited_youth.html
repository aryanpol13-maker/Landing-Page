<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intuited Youth</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0a0a08;
    color: #f0ede4;
    font-family: 'DM Sans', sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 2rem 1rem;
  }
  .orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
  .orb1 { width:500px;height:500px;top:-180px;right:-100px;background:radial-gradient(circle,rgba(212,163,87,0.13) 0%,transparent 70%); }
  .orb2 { width:350px;height:350px;bottom:-100px;left:-80px;background:radial-gradient(circle,rgba(212,163,87,0.08) 0%,transparent 70%); }
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    padding: 2.8rem 2.4rem 2.4rem;
    background: rgba(255,255,255,0.03);
    border: 0.5px solid rgba(212,163,87,0.22);
    border-radius: 24px;
    backdrop-filter: blur(16px);
    animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
  .logo-row { display:flex;align-items:center;gap:14px;margin-bottom:0.5rem; }
  .logo-mark {
    width:50px;height:50px;flex-shrink:0;
    background:linear-gradient(135deg,#c8963e,#f0c97a);
    border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:#0a0a08;
  }
  h1 { font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:#f0ede4;line-height:1.15; }
  .tagline { font-size:0.78rem;font-weight:300;color:rgba(240,237,228,0.4);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:2rem;margin-left:2px; }
  .divider { width:100%;height:0.5px;background:linear-gradient(90deg,transparent,rgba(212,163,87,0.45),transparent);margin-bottom:1.5rem; }
  .links { display:flex;flex-direction:column;gap:10px; }
  .link-btn {
    display:flex;align-items:center;gap:14px;
    padding:0.82rem 1rem;
    background:rgba(255,255,255,0.04);
    border:0.5px solid rgba(255,255,255,0.07);
    border-radius:14px;text-decoration:none;color:#f0ede4;
    transition:background 0.2s,border-color 0.2s,transform 0.15s;
    animation:fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
  }
  .link-btn:nth-child(1){animation-delay:0.08s}
  .link-btn:nth-child(2){animation-delay:0.15s}
  .link-btn:nth-child(3){animation-delay:0.22s}
  .link-btn:nth-child(4){animation-delay:0.29s}
  .link-btn:nth-child(5){animation-delay:0.36s}
  .link-btn:hover { background:rgba(212,163,87,0.09);border-color:rgba(212,163,87,0.3);transform:translateX(5px); }
  .icon-wrap { width:36px;height:36px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center; }
  .icon-wrap svg { width:18px;height:18px; }
  .link-label { flex:1; }
  .link-sub { font-size:0.7rem;color:rgba(240,237,228,0.38);display:block; }
  .link-name { font-size:0.88rem;font-weight:500; }
  .arr { opacity:0.28;font-size:13px;transition:opacity 0.2s,transform 0.2s; }
  .link-btn:hover .arr { opacity:0.7;transform:translateX(3px); }
  .qr-section { margin-top:1.8rem;padding-top:1.6rem;border-top:0.5px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;align-items:center;gap:0.9rem; }
  .qr-label { font-size:0.73rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(240,237,228,0.32); }
  .qr-wrap { padding:12px;background:#fff;border-radius:14px; }
  .footer-note { font-size:0.7rem;color:rgba(240,237,228,0.22);text-align:center; }
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="card">
  <div class="logo-row">
    <div class="logo-mark">IY</div>
    <h1>Intuited<br>Youth</h1>
  </div>
  <p class="tagline">Student Community · CAP Round Guidance</p>
  <div class="divider"></div>
  <div class="links">

    <a class="link-btn" href="https://youtube.com/@intuitedyouth" target="_blank" rel="noopener">
      <div class="icon-wrap" style="background:rgba(255,0,0,0.1);">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ff4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="3"/><polygon points="10,9 16,12 10,15" fill="#ff4444" stroke="none"/>
        </svg>
      </div>
      <span class="link-label"><span class="link-sub">Videos & Guides</span><span class="link-name">YouTube</span></span>
      <span class="arr">→</span>
    </a>

    <a class="link-btn" href="https://www.instagram.com/intuitedyouth" target="_blank" rel="noopener">
      <div class="icon-wrap" style="background:rgba(225,48,108,0.1);">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <defs><linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f09433"/><stop offset="50%" stop-color="#dc2743"/><stop offset="100%" stop-color="#bc1888"/></linearGradient></defs>
          <rect x="2" y="2" width="20" height="20" rx="5" stroke="url(#ig)"/>
          <circle cx="12" cy="12" r="5" stroke="url(#ig)"/>
          <circle cx="17.5" cy="6.5" r="1" fill="#e6683c" stroke="none"/>
        </svg>
      </div>
      <span class="link-label"><span class="link-sub">Reels & Stories</span><span class="link-name">Instagram</span></span>
      <span class="arr">→</span>
    </a>

    <a class="link-btn" href="https://x.com/IntuitedYouth" target="_blank" rel="noopener">
      <div class="icon-wrap" style="background:rgba(255,255,255,0.06);">
        <svg viewBox="0 0 24 24" fill="#f0ede4" stroke="none">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L2.18 2.25h6.967l4.259 5.63 5.838-5.63Zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </div>
      <span class="link-label"><span class="link-sub">Updates & Threads</span><span class="link-name">X (Twitter)</span></span>
      <span class="arr">→</span>
    </a>

    <a class="link-btn" href="https://www.facebook.com/share/1QPuNWWGmj/" target="_blank" rel="noopener">
      <div class="icon-wrap" style="background:rgba(24,119,242,0.12);">
        <svg viewBox="0 0 24 24" fill="#4f93f5" stroke="none">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
      </div>
      <span class="link-label"><span class="link-sub">Community & Posts</span><span class="link-name">Facebook</span></span>
      <span class="arr">→</span>
    </a>

    <a class="link-btn" href="https://www.linkedin.com/in/youth-on-fire-170598412" target="_blank" rel="noopener">
      <div class="icon-wrap" style="background:rgba(0,119,182,0.12);">
        <svg viewBox="0 0 24 24" fill="#4f9dca" stroke="none">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
      </div>
      <span class="link-label"><span class="link-sub">Professional Network</span><span class="link-name">LinkedIn</span></span>
      <span class="arr">→</span>
    </a>

  </div>
  <div class="qr-section">
    <span class="qr-label">Scan to share this page</span>
    <div class="qr-wrap"><div id="qrcode"></div></div>
    <p class="footer-note">Share with anyone navigating admissions</p>
  </div>
</div>
<script>
  new QRCode(document.getElementById('qrcode'), {
    text: window.location.href || 'https://intuitedyouth.bio',
    width: 136, height: 136,
    colorDark: '#0a0a08', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
</script>
</body>
</html>
